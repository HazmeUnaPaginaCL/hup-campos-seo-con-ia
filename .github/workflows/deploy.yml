name: Deploy to WordPress.org

"on":
  release:
    types: [published]

permissions:
  contents: write

jobs:
  tag:
    name: New release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Detiene la publicación si la etiqueta, el plugin y el readme no dicen lo mismo.
      - name: Check version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PLUGIN=$(sed -n 's/^ \* Version:[[:space:]]*//p' hup-campos-seo-con-ia.php | tr -d '\r ')
          STABLE=$(sed -n 's/^Stable tag:[[:space:]]*//p' readme.txt | tr -d '\r ')
          echo "Release: $VERSION | Plugin: $PLUGIN | Stable tag: $STABLE"
          if [ "$VERSION" != "$PLUGIN" ] || [ "$VERSION" != "$STABLE" ]; then
            echo "::error::La versión de la Release, del plugin y del readme no coinciden."
            exit 1
          fi

      - name: WordPress Plugin Deploy
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: true
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: hup-campos-seo-con-ia

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "${{ steps.deploy.outputs.zip-path }}" --clobber
